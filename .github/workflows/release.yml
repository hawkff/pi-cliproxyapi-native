# Publishes a tagged version to npm through trusted publishing (OIDC). npm attaches provenance.
#
# One-time setup on npmjs.com under the package's Settings, Trusted Publisher, GitHub Actions:
# user hawkff, repository pi-cliproxyapi-native, workflow filename release.yml, no environment,
# with "Allow npm publish" ticked. The configuration expires unless a publish succeeds within
# two days, so create it right before a release. Once a publish has succeeded, set Publishing
# access to "Require two-factor authentication and disallow tokens".
#
# Release: merge the version bump into main, then
#   gh release create vX.Y.Z --target main --title "Pi CLIProxyAPI Native vX.Y.Z" --notes-file notes.md
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Tests and dependencies run here, without access to the OIDC token.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      - run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm publish --ignore-scripts
